name: Share a Conductor usage split
description: Share the usage split from a hand-back.
title: "Conductor usage split: "
labels: ["win"]
body:
  - type: markdown
    attributes:
      value: "Tell us what you handed /conductor and paste the line that starts with Usage split: from its hand-back. That is the whole submission."
  - type: textarea
    id: objective
    attributes:
      label: What did you hand /conductor?
      placeholder: "The objective, 1 or 2 lines, e.g. add pagination to the users API and cover it with tests"
  - type: textarea
    id: receipt
    attributes:
      label: Your usage split
      placeholder: "Paste the hand-back line, e.g. Usage split: Conductor on opus; 3 builders on sonnet, 1 scout on haiku, 2 critics on sonnet. Token counts were not measured."
  - type: input
    id: who
    attributes:
      label: How should we credit you? (optional)
      placeholder: "@yourhandle, your name, or leave blank"
